[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensor-frame-validator"
version = "0.1.0"
description = "A small validator for temperature and humidity sensor frames."
requires-python = ">=3.13"

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["sensor_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]